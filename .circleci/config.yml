version: 2.1

parameters:
  force_full:
    type: boolean
    default: false
jobs:
  validate:
    docker:
      - image: cimg/node:22.14.0
    resource_class: small
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run:
          name: Check whether full verification is needed
          environment:
            CI_DEFAULT_BRANCH: "main"
            CI_BASE_REVISION: << pipeline.git.base_revision >>
            CI_FORCE_FULL: << pipeline.parameters.force_full >>
          command: bash .circleci/should-run.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci -- --runInBand
      - run: npx --no-install tsc --noEmit
      - run: npm run build
workflows:
  validate:
    when:
      or:
        - << pipeline.parameters.force_full >>
        - not:
            equal: ["main", << pipeline.git.branch >>]
    jobs:
      - validate
